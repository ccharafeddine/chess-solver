name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      # LFS is deliberately not fetched: the Stockfish WASM binary is not
      # needed for lint/tests, and Vite copies the LFS pointer file harmlessly.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build
