name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release and upload assets to (builds from the dispatched branch)'
        required: true

permissions:
  contents: write

jobs:
  # Creates the GitHub release for a pushed tag if it doesn't exist yet, so
  # pushing a tag is all a release takes. Notes come from
  # docs/release-notes/<tag>.md when present, else GitHub's generated notes.
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          notes="docs/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi

  windows:
    name: Windows portable .exe
    needs: release
    runs-on: windows-latest
    steps:
      # The Stockfish engine comes from the `stockfish` npm package (npm ci).
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable exe
        # --publish never: assets are uploaded with gh below; without it,
        # electron-builder's CI detection tries to publish and fails.
        run: npm run dist -- --publish never

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" release/*.exe --clobber

  macos:
    name: macOS universal .dmg
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build universal dmg
        run: npm run dist -- --publish never

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" release/*.dmg --clobber
